<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7EDDF"/>
      <stop offset=".55" stop-color="#EAD8C2"/>
      <stop offset="1" stop-color="#D9C1A6"/>
    </linearGradient>
    <linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94623F"/>
      <stop offset="1" stop-color="#5E3A22"/>
    </linearGradient>
    <linearGradient id="saco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8B288"/>
      <stop offset=".6" stop-color="#C69B6F"/>
      <stop offset="1" stop-color="#A97E55"/>
    </linearGradient>
    <linearGradient id="xicara" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFBF6"/>
      <stop offset=".55" stop-color="#F1E7DA"/>
      <stop offset="1" stop-color="#D6C7B5"/>
    </linearGradient>
    <radialGradient id="cafe" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#7A4A2A"/>
      <stop offset="1" stop-color="#3A2112"/>
    </radialGradient>
    <radialGradient id="pao" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#F6D08A"/>
      <stop offset=".7" stop-color="#D99A48"/>
      <stop offset="1" stop-color="#B9772E"/>
    </radialGradient>
    <linearGradient id="canela" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A65B2E"/>
      <stop offset="1" stop-color="#6E3416"/>
    </linearGradient>
    <radialGradient id="vinheta" cx=".5" cy=".5" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </radialGradient>
    <filter id="suave" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="vapor" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Parede com luz de janela -->
  <rect width="800" height="420" fill="url(#parede)"/>
  <polygon points="40,10 270,10 350,400 120,400" fill="#FFFFFF" opacity=".42" filter="url(#suave)"/>
  <g opacity=".14" stroke="#7A5A3A" stroke-width="6" filter="url(#vapor)">
    <line x1="155" y1="10" x2="235" y2="400"/>
    <line x1="60" y1="200" x2="310" y2="200"/>
  </g>

  <!-- Mesa de madeira -->
  <rect y="400" width="800" height="200" fill="url(#mesa)"/>
  <rect y="398" width="800" height="5" fill="#B07F57" opacity=".7"/>
  <g stroke="#4A2C18" stroke-width="2" fill="none" opacity=".35">
    <path d="M0 440 C160 432 300 450 460 440 S700 430 800 444"/>
    <path d="M0 492 C200 484 340 500 520 490 S720 482 800 496"/>
    <path d="M0 548 C180 540 360 560 540 548 S720 538 800 552"/>
  </g>

  <!-- Saco de café -->
  <ellipse cx="348" cy="470" rx="118" ry="14" fill="#2A170C" opacity=".35" filter="url(#vapor)"/>
  <path d="M262 196 L428 196 L446 468 L246 468 Z" fill="url(#saco)"/>
  <path d="M262 196 L272 150 L418 150 L428 196 Z" fill="#B78A5F"/>
  <g stroke="#8E6640" stroke-width="2" opacity=".7">
    <line x1="268" y1="166" x2="422" y2="166"/>
    <line x1="266" y1="180" x2="424" y2="180"/>
  </g>
  <path d="M420 196 L446 468 L428 468 L406 196 Z" fill="#9A7049" opacity=".55"/>
  <rect x="284" y="246" width="126" height="156" rx="6" fill="#FBF5EC"/>
  <rect x="290" y="252" width="114" height="144" rx="4" fill="none" stroke="#7A4A2A" stroke-width="1.2" opacity=".6"/>
  <text x="347" y="276" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="2.4" fill="#7A4A2A">CAFÉ SERRA</text>
  <path d="M320 300 L334 286 L344 296 L354 282 L374 300 Z" fill="#35624A"/>
  <text x="347" y="327" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#3B2414">Café de</text>
  <text x="347" y="353" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#3B2414">Inverno</text>
  <text x="347" y="374" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#6B4A33">chocolate &amp; canela</text>
  <text x="347" y="391" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" fill="#6B4A33">250 g · torra média</text>

  <!-- Pão de queijo -->
  <ellipse cx="722" cy="462" rx="66" ry="15" fill="#2A170C" opacity=".3" filter="url(#vapor)"/>
  <ellipse cx="722" cy="455" rx="64" ry="15" fill="#EFE6DA"/>
  <ellipse cx="722" cy="452" rx="50" ry="10" fill="#E2D6C6"/>
  <circle cx="700" cy="432" r="21" fill="url(#pao)"/>
  <circle cx="742" cy="430" r="20" fill="url(#pao)"/>
  <circle cx="722" cy="446" r="21" fill="url(#pao)"/>

  <!-- Xícara -->
  <ellipse cx="560" cy="472" rx="104" ry="18" fill="#2A170C" opacity=".35" filter="url(#vapor)"/>
  <ellipse cx="560" cy="464" rx="96" ry="19" fill="#E9DFD2"/>
  <ellipse cx="560" cy="461" rx="74" ry="12" fill="#DDD0BF"/>
  <path d="M622 386 C668 384 668 444 616 440" fill="none" stroke="#E7DCCD" stroke-width="13" stroke-linecap="round"/>
  <path d="M494 368 L626 368 C622 440 600 462 560 462 C520 462 498 440 494 368 Z" fill="url(#xicara)"/>
  <ellipse cx="560" cy="368" rx="66" ry="13" fill="#F7F0E7"/>
  <ellipse cx="560" cy="370" rx="58" ry="10" fill="url(#cafe)"/>
  <ellipse cx="546" cy="368" rx="16" ry="3" fill="#B98258" opacity=".55"/>

  <!-- Vapor -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".65" filter="url(#vapor)">
    <path d="M540 350 C528 326 554 314 542 290 C532 270 548 258 544 240"/>
    <path d="M566 352 C556 330 582 318 570 296 C560 276 576 264 572 248"/>
    <path d="M590 350 C582 332 602 322 594 304"/>
  </g>

  <!-- Canela -->
  <g transform="translate(78 522) rotate(-11)">
    <rect width="214" height="22" rx="11" fill="url(#canela)"/>
    <rect y="6" width="214" height="3" fill="#C27A47" opacity=".6"/>
    <ellipse cx="4" cy="11" rx="5" ry="11" fill="#5A2A10"/>
    <path d="M4 4 a7 7 0 1 1 0 14" fill="none" stroke="#8B4A25" stroke-width="2"/>
  </g>
  <g transform="translate(96 548) rotate(-6)">
    <rect width="190" height="20" rx="10" fill="url(#canela)"/>
    <rect y="5" width="190" height="3" fill="#C27A47" opacity=".6"/>
    <ellipse cx="4" cy="10" rx="5" ry="10" fill="#5A2A10"/>
  </g>

  <!-- Grãos -->
  <g fill="#3E2414">
    <g transform="translate(430 520) rotate(20)"><ellipse rx="12" ry="8"/><path d="M-10 0 C-3 -3 3 3 10 0" stroke="#1C0F07" stroke-width="2" fill="none"/></g>
    <g transform="translate(458 540) rotate(-30)"><ellipse rx="12" ry="8"/><path d="M-10 0 C-3 -3 3 3 10 0" stroke="#1C0F07" stroke-width="2" fill="none"/></g>
    <g transform="translate(486 516) rotate(70)"><ellipse rx="12" ry="8"/><path d="M-10 0 C-3 -3 3 3 10 0" stroke="#1C0F07" stroke-width="2" fill="none"/></g>
    <g transform="translate(512 548) rotate(10)"><ellipse rx="12" ry="8"/><path d="M-10 0 C-3 -3 3 3 10 0" stroke="#1C0F07" stroke-width="2" fill="none"/></g>
    <g transform="translate(540 528) rotate(-50)"><ellipse rx="12" ry="8"/><path d="M-10 0 C-3 -3 3 3 10 0" stroke="#1C0F07" stroke-width="2" fill="none"/></g>
    <g transform="translate(470 566) rotate(40)"><ellipse rx="12" ry="8"/><path d="M-10 0 C-3 -3 3 3 10 0" stroke="#1C0F07" stroke-width="2" fill="none"/></g>
    <g transform="translate(660 540) rotate(-15)"><ellipse rx="12" ry="8"/><path d="M-10 0 C-3 -3 3 3 10 0" stroke="#1C0F07" stroke-width="2" fill="none"/></g>
    <g transform="translate(690 560) rotate(55)"><ellipse rx="12" ry="8"/><path d="M-10 0 C-3 -3 3 3 10 0" stroke="#1C0F07" stroke-width="2" fill="none"/></g>
  </g>

  <!-- Vinheta suave -->
  <rect width="800" height="600" fill="url(#vinheta)"/>
</svg>
