<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7EFE4"/>
      <stop offset="1" stop-color="#E4EDE6"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F4D3B0"/>
      <stop offset="1" stop-color="#F4D3B0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#fundo)"/>

  <!-- Textos de entrada (livros, páginas) -->
  <g transform="translate(60 150)">
    <rect x="0" y="230" width="150" height="26" rx="4" fill="#7A4A2A"/>
    <rect x="10" y="204" width="140" height="26" rx="4" fill="#35624A"/>
    <rect x="-4" y="178" width="150" height="26" rx="4" fill="#B4572B"/>
    <rect x="20" y="40" width="110" height="130" rx="8" fill="#FFFFFF" stroke="#D9CBB8" stroke-width="2" transform="rotate(-8 75 105)"/>
    <rect x="34" y="30" width="110" height="130" rx="8" fill="#FFFFFF" stroke="#D9CBB8" stroke-width="2"/>
    <g stroke="#C9B9A4" stroke-width="5" stroke-linecap="round">
      <line x1="50" y1="56" x2="126" y2="56"/><line x1="50" y1="74" x2="118" y2="74"/><line x1="50" y1="92" x2="128" y2="92"/>
      <line x1="50" y1="110" x2="104" y2="110"/><line x1="50" y1="128" x2="122" y2="128"/>
    </g>
  </g>

  <!-- Palavras fluindo -->
  <g font-size="15" font-weight="600">
    <g transform="translate(232 180)"><rect width="66" height="28" rx="14" fill="#FFFFFF" stroke="#E0D3C2"/><text x="33" y="19" text-anchor="middle" fill="#7A4A2A">café</text></g>
    <g transform="translate(250 252)"><rect width="76" height="28" rx="14" fill="#FFFFFF" stroke="#E0D3C2"/><text x="38" y="19" text-anchor="middle" fill="#35624A">passado</text></g>
    <g transform="translate(226 324)"><rect width="52" height="28" rx="14" fill="#FFFFFF" stroke="#E0D3C2"/><text x="26" y="19" text-anchor="middle" fill="#B4572B">na</text></g>
    <g transform="translate(262 396)"><rect width="60" height="28" rx="14" fill="#FFFFFF" stroke="#E0D3C2"/><text x="30" y="19" text-anchor="middle" fill="#7A4A2A">hora</text></g>
  </g>
  <g fill="none" stroke="#C9B9A4" stroke-width="2" stroke-dasharray="4 6">
    <path d="M300 194 C340 200 350 260 380 280"/><path d="M328 266 C350 270 360 285 378 292"/>
    <path d="M280 338 C330 334 350 310 378 302"/><path d="M324 410 C360 400 360 330 382 312"/>
  </g>

  <!-- Rede (o modelo) -->
  <circle cx="470" cy="300" r="150" fill="url(#brilho)"/>
  <g stroke="#B99A7C" stroke-width="1.6" opacity=".8">
    <line x1="400" y1="230" x2="470" y2="200"/><line x1="400" y1="230" x2="470" y2="300"/><line x1="400" y1="230" x2="470" y2="400"/>
    <line x1="400" y1="300" x2="470" y2="200"/><line x1="400" y1="300" x2="470" y2="300"/><line x1="400" y1="300" x2="470" y2="400"/>
    <line x1="400" y1="370" x2="470" y2="200"/><line x1="400" y1="370" x2="470" y2="300"/><line x1="400" y1="370" x2="470" y2="400"/>
    <line x1="470" y1="200" x2="540" y2="250"/><line x1="470" y1="200" x2="540" y2="350"/>
    <line x1="470" y1="300" x2="540" y2="250"/><line x1="470" y1="300" x2="540" y2="350"/>
    <line x1="470" y1="400" x2="540" y2="250"/><line x1="470" y1="400" x2="540" y2="350"/>
  </g>
  <g>
    <circle cx="400" cy="230" r="14" fill="#7A4A2A"/><circle cx="400" cy="300" r="14" fill="#7A4A2A"/><circle cx="400" cy="370" r="14" fill="#7A4A2A"/>
    <circle cx="470" cy="200" r="16" fill="#35624A"/><circle cx="470" cy="300" r="16" fill="#35624A"/><circle cx="470" cy="400" r="16" fill="#35624A"/>
    <circle cx="540" cy="250" r="14" fill="#B4572B"/><circle cx="540" cy="350" r="14" fill="#B4572B"/>
  </g>

  <!-- Saída: próxima palavra -->
  <g stroke="#B99A7C" stroke-width="2"><line x1="554" y1="250" x2="600" y2="270"/><line x1="554" y1="350" x2="600" y2="330"/></g>
  <g transform="translate(600 226)">
    <rect width="150" height="148" rx="16" fill="#FFFFFF" stroke="#E0D3C2" stroke-width="2"/>
    <text x="16" y="30" font-size="12" font-weight="700" fill="#8A7A68" letter-spacing="1">PRÓXIMA PALAVRA</text>
    <text x="16" y="58" font-size="15" font-weight="700" fill="#3B2414">com</text>
    <rect x="70" y="47" width="64" height="12" rx="6" fill="#7A4A2A"/>
    <text x="16" y="86" font-size="15" fill="#3B2414">e</text>
    <rect x="70" y="75" width="34" height="12" rx="6" fill="#C9A88A"/>
    <text x="16" y="114" font-size="15" fill="#3B2414">no</text>
    <rect x="70" y="103" width="20" height="12" rx="6" fill="#E0CDB8"/>
    <text x="16" y="138" font-size="15" fill="#3B2414">…</text>
  </g>
</svg>
