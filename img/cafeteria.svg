<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE2D0"/>
      <stop offset="1" stop-color="#E2CDB4"/>
    </linearGradient>
    <linearGradient id="balcao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E5C3A"/>
      <stop offset="1" stop-color="#5E3A22"/>
    </linearGradient>
    <linearGradient id="janela" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE3EA"/>
      <stop offset="1" stop-color="#F4E6CF"/>
    </linearGradient>
    <radialGradient id="luz" cx=".5" cy="0" r="1">
      <stop offset="0" stop-color="#FFE6A8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFE6A8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#parede)"/>
  <!-- Piso -->
  <rect y="520" width="800" height="80" fill="#B88E68"/>
  <g stroke="#A47B57" stroke-width="2"><line x1="0" y1="550" x2="800" y2="550"/><line x1="0" y1="578" x2="800" y2="578"/></g>

  <!-- Janela com a serra ao fundo -->
  <rect x="40" y="70" width="210" height="270" rx="10" fill="#7A4A2A"/>
  <rect x="52" y="82" width="186" height="246" rx="4" fill="url(#janela)"/>
  <path d="M52 250 L100 200 L140 232 L180 186 L238 240 L238 328 L52 328 Z" fill="#7FA48C"/>
  <path d="M52 280 L110 246 L170 272 L238 250 L238 328 L52 328 Z" fill="#4F7A60"/>
  <circle cx="190" cy="130" r="20" fill="#FFE3A3"/>
  <rect x="142" y="82" width="6" height="246" fill="#7A4A2A"/>
  <rect x="52" y="200" width="186" height="6" fill="#7A4A2A"/>
  <!-- Vaso na janela -->
  <rect x="78" y="300" width="36" height="34" rx="4" fill="#C0643A"/>
  <g fill="#3F7354"><ellipse cx="88" cy="292" rx="9" ry="20" transform="rotate(-25 88 292)"/><ellipse cx="104" cy="288" rx="9" ry="22" transform="rotate(20 104 288)"/><ellipse cx="96" cy="282" rx="8" ry="22"/></g>

  <!-- Quadro-negro do cardápio -->
  <rect x="300" y="60" width="230" height="170" rx="8" fill="#6B4329"/>
  <rect x="310" y="70" width="210" height="150" rx="4" fill="#2E3532"/>
  <text x="415" y="102" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#F3E9DA" letter-spacing="2">CARDÁPIO</text>
  <g stroke="#E8DDCC" stroke-width="3" stroke-linecap="round" opacity=".8">
    <line x1="330" y1="128" x2="440" y2="128"/><line x1="470" y1="128" x2="500" y2="128"/>
    <line x1="330" y1="152" x2="420" y2="152"/><line x1="470" y1="152" x2="500" y2="152"/>
    <line x1="330" y1="176" x2="450" y2="176"/><line x1="470" y1="176" x2="500" y2="176"/>
    <line x1="330" y1="200" x2="400" y2="200"/><line x1="470" y1="200" x2="500" y2="200"/>
  </g>

  <!-- Prateleira com pacotes -->
  <rect x="570" y="190" width="200" height="10" rx="3" fill="#7A4A2A"/>
  <g>
    <path d="M584 130 L622 130 L626 190 L580 190 Z" fill="#C69B6F"/><rect x="590" y="150" width="26" height="22" rx="2" fill="#FBF5EC"/>
    <path d="M636 124 L676 124 L680 190 L632 190 Z" fill="#B88A5E"/><rect x="642" y="146" width="28" height="24" rx="2" fill="#FBF5EC"/>
    <path d="M690 132 L726 132 L730 190 L686 190 Z" fill="#C69B6F"/><rect x="695" y="152" width="26" height="22" rx="2" fill="#FBF5EC"/>
    <rect x="738" y="150" width="26" height="40" rx="4" fill="#35624A"/>
  </g>
  <!-- Luminárias -->
  <g>
    <line x1="420" y1="0" x2="420" y2="262" stroke="#3B2414" stroke-width="2"/>
    <path d="M396 262 L444 262 L432 236 L408 236 Z" fill="#35624A"/>
    <ellipse cx="420" cy="300" rx="90" ry="70" fill="url(#luz)" opacity=".5" filter="url(#blur)"/>
    <line x1="640" y1="0" x2="640" y2="232" stroke="#3B2414" stroke-width="2"/>
    <path d="M616 232 L664 232 L652 206 L628 206 Z" fill="#35624A"/>
  </g>

  <!-- Balcão -->
  <rect x="270" y="360" width="530" height="170" fill="url(#balcao)"/>
  <rect x="262" y="348" width="546" height="18" rx="4" fill="#A9774F"/>
  <g stroke="#4E2F1A" stroke-width="2" opacity=".5">
    <line x1="340" y1="380" x2="340" y2="520"/><line x1="440" y1="380" x2="440" y2="520"/>
    <line x1="540" y1="380" x2="540" y2="520"/><line x1="640" y1="380" x2="640" y2="520"/><line x1="740" y1="380" x2="740" y2="520"/>
  </g>
  <!-- Máquina de espresso -->
  <rect x="560" y="268" width="150" height="82" rx="10" fill="#C9CED3"/>
  <rect x="572" y="280" width="126" height="24" rx="5" fill="#9EA5AC"/>
  <rect x="590" y="304" width="14" height="22" rx="3" fill="#2E3532"/><rect x="666" y="304" width="14" height="22" rx="3" fill="#2E3532"/>
  <rect x="588" y="330" width="18" height="16" rx="3" fill="#F6EFE6"/><rect x="664" y="330" width="18" height="16" rx="3" fill="#F6EFE6"/>
  <!-- Bolo e pães no balcão -->
  <ellipse cx="350" cy="346" rx="44" ry="8" fill="#EFE6DA"/>
  <path d="M316 346 L318 314 C330 304 370 304 382 314 L384 346 Z" fill="#E2B060"/>
  <path d="M318 318 C334 310 366 310 382 318" fill="none" stroke="#F6E2B8" stroke-width="5"/>
  <ellipse cx="465" cy="346" rx="40" ry="8" fill="#EFE6DA"/>
  <circle cx="452" cy="334" r="12" fill="#DDA052"/><circle cx="476" cy="334" r="12" fill="#D99A48"/><circle cx="464" cy="324" r="11" fill="#E8B86A"/>

  <!-- Mesa e cadeira em primeiro plano -->
  <ellipse cx="140" cy="430" rx="110" ry="20" fill="#7A4A2A"/>
  <rect x="134" y="436" width="12" height="90" fill="#5E3A22"/>
  <rect x="96" y="520" width="88" height="8" rx="4" fill="#5E3A22"/>
  <path d="M110 416 L110 396 C110 384 150 384 150 396 L150 416 Z" fill="#F6EFE6"/>
  <ellipse cx="130" cy="396" rx="20" ry="5" fill="#4A2C1A"/>
  <path d="M150 400 C166 400 166 414 150 414" fill="none" stroke="#F6EFE6" stroke-width="5"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".7" stroke-linecap="round">
    <path d="M124 380 C118 368 132 362 126 350"/><path d="M136 380 C130 368 144 362 138 350"/>
  </g>
</svg>
