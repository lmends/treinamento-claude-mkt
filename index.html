<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambiente de Treinamento · IA para Marketing</title>
  <meta name="description" content="Treinamento interativo de IA generativa para marketing e criação de conteúdo, com conversas simuladas.">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237A4A2A'/%3E%3Cpath d='M10 13h10v5a5 5 0 0 1-5 5 5 5 0 0 1-5-5z' fill='%23FAF9F7'/%3E%3Cpath d='M20 14h1.5a2.5 2.5 0 0 1 0 5H20' fill='none' stroke='%23FAF9F7' stroke-width='1.6'/%3E%3C/svg%3E">
  <script src="js/content.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#conteudo-principal" data-ui="pularParaConteudo">Pular para o conteúdo</a>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="btn-menu" type="button" aria-controls="sidebar" aria-expanded="false">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="sr-only" data-ui="abrirMenu">Abrir lista de módulos</span>
    </button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M10 13h10v5a5 5 0 0 1-5 5 5 5 0 0 1-5-5z" fill="var(--on-accent)"/><path d="M20 14h1.5a2.5 2.5 0 0 1 0 5H20" fill="none" stroke="var(--on-accent)" stroke-width="1.6"/><path d="M13 7c1 1.2-1 2.2 0 3.4M17 7c1 1.2-1 2.2 0 3.4" fill="none" stroke="var(--on-accent)" stroke-width="1.4" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-text">
        <strong id="brand-nome">Ambiente de Treinamento</strong>
        <span id="brand-sub" class="brand-sub"></span>
      </span>
    </div>
    <div class="topbar-progress" aria-live="polite">
      <span id="progresso-texto" class="progress-text"></span>
      <span class="progress-track" aria-hidden="true"><span id="progresso-barra" class="progress-fill"></span></span>
    </div>
    <div class="topbar-actions">
      <div class="mode-group" role="group" id="grupo-modo">
        <button class="mode-btn" type="button" data-modo="apresentacao" aria-pressed="true" data-blur-on-click>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 16v4M8 20h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="mode-label"></span>
        </button>
        <button class="mode-btn" type="button" data-modo="estudo" aria-pressed="false" data-blur-on-click>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" transform="translate(0 -1)"/></svg>
          <span class="mode-label"></span>
        </button>
      </div>
      <button class="icon-btn" id="btn-tema" type="button" data-blur-on-click>
        <svg class="ic-sun" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ic-moon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span class="sr-only" id="btn-tema-rotulo"></span>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-labelledby="sidebar-titulo">
      <h2 class="sidebar-title" id="sidebar-titulo"></h2>
      <ol class="module-list" id="lista-modulos"></ol>
      <p class="sidebar-hint" id="dica-teclado"></p>
    </nav>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <main class="main" id="conteudo-principal" tabindex="-1">
      <div class="module" id="modulo"></div>
      <nav class="pager" id="paginacao">
        <button class="btn btn-ghost" id="btn-anterior" type="button" data-blur-on-click>
          <span aria-hidden="true">←</span> <span id="btn-anterior-rotulo"></span>
        </button>
        <span class="pager-count" id="paginacao-contagem"></span>
        <button class="btn btn-primary" id="btn-proximo" type="button" data-blur-on-click>
          <span id="btn-proximo-rotulo"></span> <span aria-hidden="true">→</span>
        </button>
      </nav>
    </main>

    <div class="panel-backdrop" id="painel-fundo" hidden></div>
    <aside class="artifact-panel" id="painel-artefato" hidden aria-labelledby="painel-titulo" tabindex="-1">
      <div class="artifact-head">
        <div>
          <p class="artifact-kicker" id="painel-kicker"></p>
          <h2 class="artifact-title" id="painel-titulo"></h2>
        </div>
        <button class="icon-btn" id="btn-fechar-painel" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="sr-only" id="btn-fechar-painel-rotulo"></span>
        </button>
      </div>
      <div class="tabs artifact-tabs" id="painel-abas" role="tablist" hidden></div>
      <div class="artifact-body" id="painel-corpo"></div>
      <div class="artifact-foot">
        <button class="btn btn-primary" id="btn-copiar-artefato" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span id="btn-copiar-artefato-rotulo"></span>
        </button>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Este material precisa de JavaScript ativado para funcionar.</p></noscript>
</body>
</html>
